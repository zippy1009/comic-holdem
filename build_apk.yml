name: Build Comic Holdem APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # GitHub 웹 화면에서 수동으로 'Run workflow' 버튼을 눌러 실행 가능

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Java 17 설정 (Android Gradle 빌드용)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Flutter SDK 설치 (Stable 채널)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Flutter 프로젝트 구조 자동 생성 및 main.dart 배치
        run: |
          # 만약 저장소에 main.dart 파일만 올렸더라도 자동으로 전체 Flutter 프로젝트를 생성해 줍니다.
          if [ ! -f "pubspec.yaml" ]; then
            echo "pubspec.yaml이 없으므로 Flutter 프로젝트 뼈대를 자동 생성합니다..."
            cp main.dart /tmp/main.dart
            flutter create --org com.comic.holdem --project-name comic_holdem .
            cp /tmp/main.dart lib/main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          fi

      - name: 5. 패키지 의존성 가져오기
        run: flutter pub get

      - name: 6. 안드로이드 Release APK 빌드
        run: flutter build apk --release

      - name: 7. 완성된 APK 파일 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: comic-holdem-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
